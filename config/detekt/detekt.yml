# WLO detekt house ruleset (buildUponDefaultConfig = true).
#
# D8 (no exceptions across module boundaries) is enforced by review, not by a
# custom rule in M1 — TODO(follow-up): custom detekt ruleset for D6/D7 once the
# rule API settles; D7 is checked structurally by `checkArchitecture`.
build:
  maxIssues: 0

complexity:
  TooManyFunctions:
    active: false
  LongMethod:
    active: true
    # Compose screen functions are declarative trees; this catches true
    # outliers without forcing extraction solely to satisfy a line count.
    threshold: 240
  LongParameterList:
    active: true
    functionThreshold: 14
    constructorThreshold: 16
    ignoreDefaultParameters: true
  CyclomaticComplexMethod:
    active: true
    threshold: 45

style:
  MagicNumber:
    # WLO's domain IS numbers (constants registry, golden fixtures); magic-number
    # suppression belongs in code review, not the gate.
    active: false
  MaxLineLength:
    maxLineLength: 120
  ReturnCount:
    active: false
  UnusedPrivateMember:
    # ktlint's no-unused-... chain and detekt overlap; keep detekt's on.
    active: true

exceptions:
  TooGenericExceptionCaught:
    active: true
    # Boundaries may translate third-party failures, but must use a named
    # variable and preserve cancellation where coroutines are involved.
    allowedExceptionNameRegex: '(_|(ignore|expected).*)'
  SwallowedException:
    active: true
    allowedExceptionNameRegex: '(_|(ignore|expected).*)'

naming:
  FunctionNaming:
    # Compose functions are PascalCase by design.
    functionPattern: '[a-zA-Z][a-zA-Z0-9]*'
  TopLevelPropertyNaming:
    constantPattern: '[A-Za-z][_A-Za-z0-9]*'
  MatchingDeclarationName:
    # WLO atoms colocate their small tone/accent/data types with the component
    # (WloBadge + WloBadgeTone in WloBadge.kt); files are named after the
    # composable, not the enum — WLO-0031.
    active: false
