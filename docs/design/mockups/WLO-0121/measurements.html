<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WLO · Body measurements</title>
<style>
@font-face{font-family:Inter;src:url('../../../../core/designsystem/src/main/res/font/inter_regular.ttf');font-weight:400}@font-face{font-family:Inter;src:url('../../../../core/designsystem/src/main/res/font/inter_semibold.ttf');font-weight:600}
:root{color-scheme:dark;--bg:#0e1116;--surface:#151a21;--fg:#e8ecf1;--muted:#9aa6b5;--line:#29313b;--accent:#3dd6a5}*{box-sizing:border-box}body{margin:0;background:#080b10;color:var(--fg);font:14px/1.5 Inter,sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer;background:none;border:0;min-height:48px}button:hover{background-color:#ffffff09}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{opacity:.4;cursor:default}.preview{max-width:470px;margin:16px auto;display:flex;gap:8px;flex-wrap:wrap}.preview button{border:1px solid var(--line);border-radius:24px;padding:0 12px;min-height:36px;font-size:12px}.phone{width:411.428571px;height:914.772036px;zoom:1.14236111;max-width:100%;margin:auto;background:var(--bg);display:flex;flex-direction:column;position:relative;overflow:hidden}.status{padding:12px 24px 6px;display:flex;justify-content:space-between;font-size:12px}.top{height:64px;display:flex;align-items:center;gap:8px;padding:0 16px;flex-shrink:0}h1{font-size:23px;letter-spacing:-.6px;margin:0;font-weight:600}h1:focus{outline:none}h2{font-size:16px;font-weight:600;margin:0 0 12px}.icon{font-size:23px;width:40px}.main{flex:1;overflow:auto;min-height:0;padding:12px 24px 24px}.muted,small{color:var(--muted)}small{font-size:12px;display:block}.hero{font-size:56px;letter-spacing:-2px;line-height:1.2;font-weight:600;margin:8px 0}.hero span{font-size:23px;letter-spacing:0;color:var(--muted);font-weight:400}.row{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}.row .value{text-align:right;font-size:19px;font-weight:600}.chevron{color:var(--muted);font-size:22px;margin-left:12px}.section{margin-top:26px;padding-top:22px;border-top:1px solid var(--line)}.primary{background:var(--accent);color:#05251b;min-height:52px;border-radius:28px;width:100%;font-weight:600}.primary:hover{background:#55deb3}.actions{padding:12px 24px 16px;flex-shrink:0}.text-button{color:var(--accent);padding:0;font-weight:600}.nav{background:var(--surface);display:flex;justify-content:space-around;padding:8px 0}.nav button{color:var(--muted);font-size:12px}.nav button:first-child{color:var(--accent)}.system{height:25px;flex-shrink:0;display:grid;place-items:center}.system:after{content:'';width:108px;height:4px;background:var(--fg);border-radius:4px}.segments{display:flex;border:1px solid #74808d;border-radius:24px;overflow:hidden;margin:24px 0 12px}.segments button{flex:1;border-right:1px solid #74808d;min-height:42px}.segments button:last-child{border:0}.segments button[aria-pressed=true]{background:#23443b;color:#bcf3de;font-weight:600}svg{width:100%;display:block}svg text{font:11px Inter;fill:var(--muted)}.field{margin:22px 0}.field label{display:block;margin-bottom:8px;font-weight:600}.inputbox{display:flex;border:1px solid #74808d;border-radius:6px;align-items:center;padding-right:14px}.inputbox input{min-width:0;width:100%;background:none;border:0;padding:14px;font-size:21px;outline-offset:-2px}.inputbox span{color:var(--muted)}.field small{margin-top:6px}.date{border:1px solid var(--line);border-radius:24px;padding:0 14px;color:var(--muted)}.banner{background:#17362e;border-radius:12px;padding:12px 16px;margin-bottom:20px}.note{max-width:470px;margin:16px auto 32px;color:var(--muted);font-size:12px}.empty{padding:65px 0}.empty p{color:var(--muted)}.chooser{display:flex;justify-content:space-between;align-items:center;min-height:60px;border-bottom:1px solid var(--line)}input[type=checkbox]{accent-color:var(--accent);width:20px;height:20px}.error{color:#ffb4ab}.toast{position:absolute;bottom:90px;left:24px;right:24px;background:#dce5e0;color:#14211b;padding:12px;border-radius:8px;z-index:5}select{background:var(--surface);padding:12px;border:1px solid #74808d;border-radius:6px;width:100%}@media(max-width:480px){.phone{zoom:1;width:100%;height:100dvh}.preview,.note{padding:0 12px}}@media(prefers-reduced-motion:no-preference){.main{animation:appear .16s ease-out}@keyframes appear{from{opacity:.6}to{opacity:1}}}
</style>
<div class="preview" aria-label="Prototype scenarios"><button onclick="go('weight')">Weight entry</button><button onclick="go('overview')">Measurements</button><button onclick="go('record')">Record</button><button onclick="empty=true;go('overview')">First use</button><button onclick="reset()">Reset example</button></div>
<div class="phone"><div class="status"><span>9:41</span><span>▰ ▰ ▰</span></div><header class="top" id="top"></header><main class="main" id="main"></main><div class="actions" id="actions"></div><div id="nav"></div><div class="system"></div><div class="toast" id="toast" role="status" hidden></div></div>
<p class="note">Interactive design proposal · 470 × 1045 preview · Fictional data. Saves stay in this preview; reload resets them. Scale sync is illustrated, not connected. Tape-estimation calculations are outside this prototype.</p>
<script>
const $=s=>document.querySelector(s);const names=['Body fat','Waist','Hips','Chest','Left thigh','Right thigh','Left arm','Right arm'];let values={'Body fat':23.4,Waist:84,Hips:98,Chest:102},dates={'Body fat':'Today',Waist:'12 September',Hips:'12 September',Chest:'28 August'},chosen=['Waist','Hips','Chest'],draft={},sources={'Body fat':'Scale'},empty=false,metric='Body fat',screen='overview',range='90 d',savedMessage=false,recordDate='2026-09-16';
const unit=n=>n==='Body fat'?'%':'cm';const fmt=v=>Number(v).toFixed(1);const row=(title,sub,action,right='')=>`<button class="row" onclick="${action}"><span>${title}<small>${sub}</small></span><span style="display:flex;align-items:center"><span class="value">${right}</span><span class="chevron">›</span></span></button>`;
function header(title,back){$('#top').innerHTML=(back?`<button class="icon" aria-label="Back" onclick="go('${back}')">‹</button>`:'')+`<h1 tabindex="-1">${title}</h1>`}
function action(label,fn){$('#actions').innerHTML=`<button class="primary" onclick="${fn}">${label}</button>`}
function chart(body=false){const ys=[96,110,124,138,152,166,180];const last=screen==='weight'?77.1:values[metric]||84;const tick=[last+1,last+.5,last];return `<svg viewBox="0 0 360 230" role="img" aria-label="Illustrative ${metric} measurements, decreasing across the selected period"><path d="M6 40H321 M6 110H321 M6 180H321" stroke="#29313b"/><text x="331" y="44">${fmt(tick[0])}</text><text x="331" y="114">${fmt(tick[1])}</text><text x="331" y="184">${fmt(tick[2])}</text><polyline points="${ys.map((y,i)=>`${10+i*49},${y}`).join(' ')}" fill="none" stroke="#3dd6a5" stroke-width="2"/>${ys.map((y,i)=>`<circle tabindex="0" role="button" aria-label="Example measurement ${i+1}; show details" onclick="point(${i})" onkeydown="if(event.key==='Enter')point(${i})" cx="${10+i*49}" cy="${y}" r="6" fill="#3dd6a5"/>`).join('')}<text x="6" y="215">19 Jun</text><text x="139" y="215">3 Aug</text><text x="270" y="215">16 Sept</text></svg><small id="point">Select a measurement for its date and value.</small>`}
function point(i){$('#point').textContent=['19 June','4 July','19 July','3 August','18 August','2 September','16 September'][i]+' · '+fmt((values[metric]||84)+(6-i)*.1)+' '+unit(metric)+' · '+(metric==='Body fat'?'Scale':'Tape measurement')}
function detail(n){metric=n;range='90 d';go('detail')}
function go(to){screen=to;$('#main').innerHTML='';$('#actions').innerHTML='';$('#nav').innerHTML='';const m=$('#main');
if(to==='weight'){header('Weight');m.innerHTML=`<small>Weight trend</small><div class="hero">77.1 <span>kg</span></div><span class="muted">Today, 16 September</span><div class="section"><h2>−1.2 kg</h2><small>Change · 3 August – 16 September</small></div>${chart()}${row('Body measurements','Body fat 23.4% today · Waist 84 cm, 12 Sept',"go('overview')")}${row('Weigh-in history','Last reading · 77.0 kg today',"notify('Weight history is outside this prototype')")}`;action('+ Weigh in',"go('weigh')");$('#nav').innerHTML='<div class="nav"><button onclick="go(\'weight\')">Weight</button><button onclick="notify(\'Hub is outside this prototype\')">Hub</button><button onclick="notify(\'Plan is outside this prototype\')">Plan</button><button onclick="notify(\'More is outside this prototype\')">More</button></div>'}
if(to==='overview'){header('Body measurements','weight');m.innerHTML=empty?`<div class="empty"><h2>Your measurements, your choice</h2><p>Record body fat, waist, hips or any measurements you want to follow.</p><p>Start with one. Add others whenever you like.</p></div>`:`${savedMessage?'<div class="banner">Measurements saved</div>':'<small>Latest measurements</small>'}${Object.keys(values).map(n=>row(n,dates[n]+(n==='Body fat'?' · '+(sources[n]||'Scale'):' · Tape'),`detail('${n}')`,fmt(values[n])+' '+unit(n))).join('')}<div class="section"><small>Body fat from your connected scale appears here with its measurement date.</small></div>`;action('+ Record measurements',"draft={};go('record')")}
if(to==='detail'){header(metric,'overview');const body=metric==='Body fat';m.innerHTML=`<small>${body?'Body fat · Scale':metric+' · Tape measurement'}</small><div class="hero">${fmt(values[metric]||84)} <span>${unit(metric)}</span></div><span class="muted">${dates[metric]==='Today'?'Today, 16 September':dates[metric]||'12 September'}</span><div class="section"><h2>${body?'−0.6 percentage points':'−0.6 cm'}</h2><small>Change · 19 June – 16 September · Example</small></div><div class="segments">${['30 d','90 d','1 y','All'].map(r=>`<button aria-pressed="${r===range}" onclick="notify('This prototype illustrates the 90-day view')">${r}</button>`).join('')}</div>${chart(body)}${body?row('Source','Scale · Imported with your weigh-ins',"notify('Scale readings stay separate from tape estimates')"):''}<div class="section"><h2>Recent measurements</h2>${[0,1,2].map((_,i)=>row([dates[metric]||'12 September','2 September','18 August'][i],body?'Scale':'Tape measurement',`notify('Read-only example measurement')`,fmt((values[metric]||84)+i*.2)+' '+unit(metric))).join('')}</div>`;action('+ Record '+(body?'body fat':'measurement'),`chosen=chosen.includes('${metric}')?chosen:['${metric}',...chosen];draft={};go('record')`)}
if(to==='record'){header('Record measurements','overview');m.innerHTML=`<label class="muted" for="date">Measurement date</label><input class="date" id="date" type="date" value="${recordDate}" onchange="recordDate=this.value" style="display:block;margin-top:8px;min-height:48px"><p class="muted">Fill in whichever measurements you took.</p>${chosen.map(n=>`<div class="field"><label for="f${names.indexOf(n)}">${n}</label><div class="inputbox"><input id="f${names.indexOf(n)}" inputmode="decimal" autocomplete="off" value="${(draft[n]||'').replaceAll('&','&amp;').replaceAll('"','&quot;').replaceAll('<','&lt;')}" oninput="draft['${n}']=this.value;validate()" aria-describedby="last${names.indexOf(n)}"><span>${unit(n)}</span></div><small id="last${names.indexOf(n)}">${!empty&&values[n]?'Last: '+fmt(values[n])+' '+unit(n)+' · '+dates[n]:'Optional'}</small></div>`).join('')}${chosen.includes('Body fat')?'<label for="source">Body fat source</label><select id="source" onchange="sources[&quot;Body fat&quot;]=this.value"><option>Scale</option><option>Other measurement</option></select>':''}<button class="text-button" onclick="go('choose')">+ Add another measurement</button><p class="error" id="error" role="status"></p>`;action('Save measurements','save()');validate()}
if(to==='choose'){header('Choose measurements','record');m.innerHTML='<p class="muted">Choose the fields you want to record. Every field is optional.</p>'+names.map(n=>`<label class="chooser">${n}<input type="checkbox" ${chosen.includes(n)?'checked':''} onchange="if(this.checked)chosen.push('${n}');else chosen=chosen.filter(x=>x!=='${n}')"></label>`).join('');action('Done',"go('record')")}
if(to==='weigh'){header('Weigh in','weight');m.innerHTML='<div class="field"><label for="weight">Weight</label><div class="inputbox"><input id="weight" inputmode="decimal" placeholder="77.0"><span>kg</span></div></div><details><summary class="text-button" style="padding:14px 0;cursor:pointer">Add body fat</summary><div class="field"><label for="bf">Body fat from scale</label><div class="inputbox"><input id="bf" inputmode="decimal"><span>%</span></div></div></details><div class="section"><small>A connected scale can supply both readings together. Manual entry lets you do the same.</small></div>';action('Save weigh-in',"notify('Illustrative weigh-in; use Record measurements to try saving')")}
m.scrollTop=0;$('#top h1').focus({preventScroll:true})}
function validate(){let entries=chosen.filter(n=>(draft[n]||'').trim());let bad=entries.some(n=>{let v=Number(draft[n].replace(',','.'));return !Number.isFinite(v)||v<=0||(n==='Body fat'&&v>=100)});$('#actions button').disabled=!entries.length||bad;$('#error').textContent=bad?'Enter a positive number. Body fat must be below 100%.':''}
function save(){chosen.forEach(n=>{if((draft[n]||'').trim()){values[n]=Number(draft[n].replace(',','.'));dates[n]=recordDate==='2026-09-16'?'Today':new Date(recordDate+'T12:00').toLocaleDateString('en-GB',{day:'numeric',month:'long'})}});empty=false;savedMessage=true;go('overview')}
function notify(s){$('#toast').textContent=s;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,2600)}function reset(){location.reload()}go('overview');
</script></html>
