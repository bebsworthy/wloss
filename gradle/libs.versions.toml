# WLO version catalog — every pin verified 2026-09-12 against registry metadata
# (dl.google.com/android/maven2 or repo1.maven.org maven-metadata.xml, per line).
# House rule: bump verified versions together (ADR-001 "exact pins live in the
# version catalog and are bumped together").

[versions]
# Kotlin 2.4.20 = <release> on repo1 kotlin-stdlib metadata (verified 2026-09-12)
kotlin = "2.4.20"
# KSP 2.3.12 = newest tag on repo1 symbol-processing-gradle-plugin metadata.
# NOTE: new plain version scheme (old <kotlin>-<ksp> scheme ended at 2.2.21-2.0.5).
# KSP 2.3.12 release notes (github.com/google/ksp/releases/tag/2.3.12, verified
# 2026-09-12) confirm Kotlin 2.x lineage (stdlib 2.3.20) + min AGP 8.12 → AGP 9.4 OK.
ksp = "2.3.12"
# AGP 9.4.0 = latest stable on dl.google.com com.android.application plugin marker
# (9.5.0 only alphas; verified 2026-09-12). Max compileSdk = 37; requires Gradle ≥ 9.6.
agp = "9.4.0"
# Gradle 9.7.1 — pinned by the wrapper (services.gradle.org); satisfies AGP 9.4 min.
gradle = "9.7.1"
# Room 3.0.3 = latest stable patch of the ADR-003-pinned 3.0.x line on
# dl.google.com androidx.room3 group index (verified 2026-09-12; 3.1.0 only alpha).
room3 = "3.0.3"
# androidx.sqlite bundled driver, latest stable on dl.google.com (verified 2026-09-12)
sqliteBundled = "2.7.1"
# DataStore 1.2.1 stable (dl.google.com group index; 1.3.0-alpha11 in flight);
# no dedicated testing artifact published (verified 2026-09-12) → tmp-dir test rule.
datastore = "1.2.1"
# Koin 4.2.2 + koin-annotations 4.2.2 — both <release> on repo1 (verified 2026-09-12)
koin = "4.2.2"
koinAnnotations = "4.2.2"
# kotlinx-coroutines 1.11.0 = <release> on repo1 (verified 2026-09-12)
coroutines = "1.11.0"
# kotlinx-serialization-json 1.11.0 = latest STABLE (1.12.0-RC excluded per ADR-004;
# verified 2026-09-12)
serializationJson = "1.11.0"
# kotlinx-datetime 0.8.0 stable (repo1; the "-0.6.x-compat" variant is legacy API;
# verified 2026-09-12)
datetime = "0.8.0"
# kotest-property 6.2.5 = <release> on repo1 io.kotest:kotest-property (verified
# 2026-09-12: kotest-property-jvm jar present, pom pins kotlin-stdlib 2.2.21 —
# readable by the 2.4.20 toolchain). Used as a LIBRARY (forAll/checkAll) inside
# kotlin-test JUnit4 tests; the kotest test framework stays out of the build.
kotestProperty = "6.2.5"
# Compose BOM 2026.09.00 — pins compose ui/foundation 1.12.1 + material3 1.4.0
# (verified 2026-09-12 via BOM POM on dl.google.com). ui 1.12.x requires
# compileSdk 37 + AGP ≥ 9.2 (compose-ui 1.12.0 release notes).
composeBom = "2026.09.00"
# ui-test is NOT managed by the BOM (verified: BOM POM has no ui-test entry);
# pinned to the matching ui line.
composeUiTest = "1.12.1"
# activity-compose 1.13.0 = latest stable (dl.google.com metadata; verified 2026-09-12)
activityCompose = "1.13.0"
# lifecycle 2.11.0 = latest stable (dl.google.com lifecycle-viewmodel-compose metadata;
# verified 2026-09-12)
lifecycle = "2.11.0"
# navigation-compose 2.10.1 = latest stable (dl.google.com metadata; verified 2026-09-12)
navigationCompose = "2.10.1"
# androidx.test 1.7.0 / ext-junit 1.3.0 / rules 1.7.0 (dl.google.com metadata;
# verified 2026-09-12 — same androidx.test line)
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
androidxTestRules = "1.7.0"
# UI Automator 2.3.0 (dl.google.com androidx.test.uiautomator group index; latest
# stable — 2.3.0, 2024-07) for shell-level instrumented steps (am force-stop)
# in the onboarding acceptance tests.
uiautomator = "2.3.0"
# Test Orchestrator 1.6.1 (dl.google.com androidx.test/orchestrator metadata,
# latest/release, verified 2026-09-12): runs each test with cleared app data
# (clearPackageData) so onboarding tests start from a cold install.
orchestrator = "1.6.1"
# okio 3.18.2 = <release> on repo1 (verified 2026-09-12); direct dep for datastore
# path plumbing (datastore itself pulls okio transitively)
okio = "3.18.2"
# Ktor 3.5.2 = <release> on repo1 io.ktor metadata (verified 2026-09-12: client-core,
# client-okhttp, client-content-negotiation, serialization-kotlinx-json all carry 3.5.2,
# lastUpdated 2026-07-31). ADR-004 pin (3.5.x line). Declared ONLY in :core:network
# (D9 allowlist — the single egress choke point).
ktor = "3.5.2"
# OkHttp 5.5.0 = <release> on repo1 com.squareup.okhttp3 (verified 2026-09-12).
# Backs Ktor's OkHttp engine (ADR-004: Android engine lacks HTTP/2) and
# mockwebserver3 5.5.0 (same line, same repo1 check) for JVM tests. Declared only
# in :core:network (D9); mockwebserver3 is additionally name-exempt (localhost test
# server, not an egress client).
okhttp = "5.5.0"
# ONNX Runtime Mobile 1.29.0 (com.microsoft.onnxruntime, MIT) — ADR-006 pin.
# <release> on repo1 onnxruntime-android metadata (verified 2026-09-12; 1.29.1/1.30.0
# AARs not on Central — see docs/tech/audit/onnxruntime.md). Consumed by :core:ai
# from PART B (PhotoAnalyzer actuals); catalog entry records the verified pin.
onnxruntime = "1.29.0"
# CameraX 1.6.2 = latest STABLE on dl.google.com androidx.camera group index
# (verified 2026-09-12; 1.7.0 only alphas). :core:media capture stack (F02 §3).
camerax = "1.6.2"
# ML Kit bundled barcode-scanning 17.3.0 / text-recognition 16.0.1 — audit-carded
# pins (docs/tech/audit/mlkit-barcode.md, mlkit-text-recognition.md; verified
# 2026-09-12). Declared ONLY in :core:ai (D1: restricted impl).
mlkitBarcode = "17.3.0"
mlkitText = "16.0.1"
# ZXing android-embedded 4.3.0 = <release> on repo1 com.journeyapps
# (verified 2026-09-12) — the Apache-2.0 BarcodeScanner fallback engine.
zxingEmbedded = "4.3.0"
# androidx.benchmark 1.5.0 = <release> on dl.google.com androidx.benchmark group
# (benchmark-macro-junit4 + benchmark-junit4, verified 2026-09-12 maven-metadata).
# M5: :benchmarks module (WLO-0027 PART A) — the F03 re-deal perf baseline.
benchmark = "1.5.0"
# androidx.test 1.7.0 / ext-junit 1.3.0 / rules 1.7.0 (dl.google.com metadata;
# BouncyCastle bcprov-jdk18on 1.86 = <release> on repo1 org.bouncycastle
# (verified 2026-09-12 via maven-metadata.xml, lastUpdated 2026-09-11; jar
# inspected: org.bouncycastle.crypto.generators.Argon2BytesGenerator +
# crypto.params.Argon2Parameters ship in the LIGHTWEIGHT API — no JCA provider
# registration needed). T-F2/T-F4: the backup KDF (Argon2id) is the one thing
# javax.crypto lacks; Tink (T-F4 alternative) was rejected — ~2 MB of facade
# for 2 primitives we already use directly (Keystore AES-GCM + Argon2).
bouncycastle = "1.86"
# WorkManager 2.11.2 = latest STABLE on dl.google.com androidx.work
# (work-runtime-ktx metadata verified 2026-09-12; 2.12.0 only rc01 — stable
# line held, house rule: no RC pins). Backs the BackupScheduler port impl.
work = "2.11.2"
# androidx.core 1.19.0 = <release> on dl.google.com core-ktx (verified
# 2026-09-12). Explicit pin for :core:vault's failure notification
# (NotificationCompat); keeps the vault's compile classpath honest.
core = "1.19.0"
# androidx.fragment 1.9.0 = <release> on dl.google.com fragment-ktx (verified
# 2026-09-12). :core:vault's PromptBiometricGate binds the PLATFORM
# BiometricPrompt, whose public constructor takes androidx FragmentActivity
# (no androidx.biometric dependency — see AppLock.kt FLAG note).
fragment = "1.9.0"
detekt = "1.23.8"
# ktlint-gradle 14.2.0 (Mar 2026, actively maintained; GitHub releases + plugin
# portal metadata, verified 2026-09-12). Chosen over a manual exec task: the v14
# line is post-Gradle-9 with Isolated-Projects compatibility work.
ktlintGradle = "14.2.0"

[libraries]
# --- Kotlinx ---
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotest-property = { module = "io.kotest:kotest-property", version.ref = "kotestProperty" }

# --- DI (Koin; wired in :app by the app-shell milestone) ---
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-annotations = { module = "io.insert-koin:koin-annotations", version.ref = "koinAnnotations" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-androidx-compose = { module = "io.insert-koin:koin-androidx-compose", version.ref = "koin" }
koin-test = { module = "io.insert-koin:koin-test", version.ref = "koin" }
koin-test-junit4 = { module = "io.insert-koin:koin-test-junit4", version.ref = "koin" }

# --- Persistence ---
androidx-room3-runtime = { module = "androidx.room3:room3-runtime", version.ref = "room3" }
androidx-room3-compiler = { module = "androidx.room3:room3-compiler", version.ref = "room3" }
androidx-room3-testing = { module = "androidx.room3:room3-testing", version.ref = "room3" }
androidx-sqlite-bundled = { module = "androidx.sqlite:sqlite-bundled", version.ref = "sqliteBundled" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
okio = { module = "com.squareup.okio:okio", version.ref = "okio" }

# --- Vault / backup crypto (T-C3/T-F1/T-F2: :core:vault ONLY — D1 restricted) ---
# Argon2id lives ONLY in BouncyCastle's lightweight API (javax.crypto has no
# KDFs); AES-GCM itself stays on javax.crypto + AndroidKeyStore. Declared only
# by :core:vault (the F13 backup/vault impl module).
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
# Backup scheduling (BackupScheduler port impl — ARCHITECTURE §2.4 "background
# work is Android glue"): :core:vault only.
androidx-work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core" }
androidx-fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }

# --- Networking (D9: :core:network ONLY — the single egress choke point) ---
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
okhttp-mockwebserver3 = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }

# --- On-device inference (ADR-006; consumed from PART B) ---
onnxruntime-android = { module = "com.microsoft.onnxruntime:onnxruntime-android", version.ref = "onnxruntime" }

# --- Capture stack (F02 §3; :core:media + :core:ai only — D1 restricted impls) ---
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
mlkit-barcode-scanning = { module = "com.google.mlkit:barcode-scanning", version.ref = "mlkitBarcode" }
mlkit-text-recognition = { module = "com.google.mlkit:text-recognition", version.ref = "mlkitText" }
zxing-android-embedded = { module = "com.journeyapps:zxing-android-embedded", version.ref = "zxingEmbedded" }

# --- AndroidX / Compose (versions via BOM) ---
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "composeUiTest" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeUiTest" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigationCompose" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidxTestRunner" }
androidx-test-rules = { module = "androidx.test:rules", version.ref = "androidxTestRules" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestExtJunit" }
androidx-test-uiautomator = { module = "androidx.test.uiautomator:uiautomator", version.ref = "uiautomator" }
# M5 perf baseline (:benchmarks, WLO-0027): the microbenchmark rule measures the
# planner in-process (a pure function has no app-process surface for
# macrobenchmark metrics); see the :benchmarks build file for the full note.
androidx-benchmark-junit4 = { module = "androidx.benchmark:benchmark-junit4", version.ref = "benchmark" }
androidx-benchmark-macro-junit4 = { module = "androidx.benchmark:benchmark-macro-junit4", version.ref = "benchmark" }
androidx-benchmark-gradle-plugin = { module = "androidx.benchmark:benchmark-gradle-plugin", version.ref = "benchmark" }
androidx-test-orchestrator = { module = "androidx.test:orchestrator", version.ref = "orchestrator" }

# --- Build-logic classpath (Gradle plugin artifacts; used by build-logic only) ---
agp = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kgp = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-compiler-gradle-plugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
ksp-gradle-plugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
room3-gradle-plugin = { module = "androidx.room3:room3-gradle-plugin", version.ref = "room3" }
detekt-gradle-plugin = { module = "io.gitlab.arturbosch.detekt:detekt-gradle-plugin", version.ref = "detekt" }
ktlint-gradle-plugin = { module = "org.jlleitschuh.gradle:ktlint-gradle", version.ref = "ktlintGradle" }

